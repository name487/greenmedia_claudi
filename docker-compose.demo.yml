# Full demo stack in production mode: PostgreSQL, Redis, API, Celery worker+beat, Django (gunicorn).
#   docker compose -f docker-compose.demo.yml up -d --build
#   open http://127.0.0.1:8000  → sign in with a demo button (password demo1234)
# Seeds 24 demo clients on first start. Google / Meta / OpenAI stay simulated until you add their keys (see README).
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://greenmedia:greenmedia@db:5432/greenmedia
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-demo-jwt-secret-please-0123456789}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  SEED_DEMO: "1"
  WEB_APP_URL: ${WEB_APP_URL:-http://127.0.0.1:8000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8001/api/google/callback}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_REDIRECT_URI: ${META_REDIRECT_URI:-http://127.0.0.1:8001/api/meta/callback}

services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: greenmedia, POSTGRES_PASSWORD: greenmedia, POSTGRES_DB: greenmedia }
    volumes: [demo-pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U greenmedia -d greenmedia"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  api:
    build: ./backend
    environment: *api-env
    ports: ["127.0.0.1:8001:8001"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app", "worker", "-B", "-l", "info", "--concurrency", "2", "-s", "/tmp/celerybeat-schedule"]
    environment: *api-env
    healthcheck:   # `up --wait` needs every service healthy; the worker answers a Celery ping
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 10s
    depends_on: { api: { condition: service_healthy } }   # the API creates/upgrades the schema first
  web:
    build: ./web
    environment:
      API_URL: http://api:8001
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-demo-django-secret-0123456789}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}   # 1 when served over HTTPS
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  demo-pgdata:
