name: iOS build

# macOS minutes cost 10x Linux ones and stop first when the account's spending limit is reached, so the unsigned iOS
# build runs only by hand (Actions -> iOS build -> Run workflow) and doesn't appear as a skipped check on every PR.
on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL || 'https://api.example.com' }}
      - run: cd build/ios/iphoneos && mkdir Payload && cp -r Runner.app Payload/ && zip -qr greenmedia-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: greenmedia-ios-unsigned, path: mobile/build/ios/iphoneos/greenmedia-unsigned.ipa, retention-days: 7 }
